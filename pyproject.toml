[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-rag"
version = "0.1.0"
description = "Question answering over arXiv research papers, with retrieval evals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qdrant-client>=1.12",
    "rank-bm25>=0.2.2",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
ingest = ["arxiv>=2.1", "pymupdf>=1.24"]
ml = ["sentence-transformers>=3.0"]
llm = ["litellm>=1.40"]
ui = ["gradio>=5.0"]
all = ["arxiv-rag[ingest,ml,llm]"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
arxiv-rag = "arxiv_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
